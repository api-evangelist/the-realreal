name: The RealReal
description: >-
  The RealReal is the world's largest online marketplace for authenticated,
  resale luxury goods, operating a managed consignment marketplace across
  women's and men's fashion, fine jewelry and watches, handbags, fine art, and
  home. Founded in 2011 and headquartered in San Francisco, the company employs
  in-house gemologists, horologists, art curators, and brand authenticators to
  verify every item, pairing that expertise with data-driven pricing and demand
  insights. The RealReal is a publicly traded company (NASDAQ: REAL) and has
  processed tens of millions of consigned items. It was surfaced as a portfolio
  company of Canaan Partners and added to the API Evangelist network; as of this
  enrichment pass The RealReal publishes no public developer API, SDK, or
  developer portal.
